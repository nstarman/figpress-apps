name: release

# A tag vYYYY.MM.DD[.N] publishes figpress-apps to PyPI with trusted publishing (environment pypi):
# no token is stored. The GitHub release and the gallery follow the steps in AGENTS.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches figpress_apps.__version__
        run: test "${GITHUB_REF_NAME}" = "v$(uv run python -c 'import figpress_apps; print(figpress_apps.__version__)')"
      - run: uv sync --all-extras
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
