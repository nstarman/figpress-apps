[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "figpress-apps"
dynamic = ["version"]
description = "Toolbox for webapps that are the interactive counterparts of scientific papers"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nathaniel Starkman" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebook = ["anywidget>=0.11,<0.12"]

[project.scripts]
figpress-apps = "figpress_apps.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-playwright>=0.10"]

[tool.hatch.version]
path = "src/figpress_apps/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/figpress_apps"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "figpress_apps/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src/figpress_apps", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: browser smoke tests (need Playwright browsers)"]
addopts = "-m 'not smoke'"
