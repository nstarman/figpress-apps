<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example figpress-apps webapp</title>
<link rel="stylesheet" href="figpress-apps/index.css">
<style>
  body { margin: 0; background: var(--fk-bg); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; font-family: var(--fk-font); color: var(--fk-fg); }
</style>
</head>
<body>
<main>
  <h1>Example figpress-apps webapp</h1>
  <p>Interactive version of Figure N of <a href="https://ui.adsabs.harvard.edu/abs/...">the paper</a>.</p>
  <div id="app"></div>
</main>
<script type="module">
  import { run } from "figpress-apps/index.js";
  import app from "app/widget.js";
  run(app, document.getElementById("app"));
</script>
</body>
</html>
